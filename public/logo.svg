  <!-- Tagline: Build for Ambitious -->
  <text x="200" y="375" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="600" font-size="14" letter-spacing="6" fill="currentColor" opacity="0.8">
